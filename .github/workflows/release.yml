name: Release Origin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false

      matrix:
        include:
          # Windows
          - platform: windows-latest
            args: ""
            target: ""

          # macOS Apple Silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin

          # macOS Intel
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      # ---------------------------------------------
      # Checkout
      # ---------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # Node
      # ---------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # ---------------------------------------------
      # Rust
      # ---------------------------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # ---------------------------------------------
      # Dependencies
      # ---------------------------------------------

      - name: Install dependencies
        run: npm install

      # ---------------------------------------------
      # Build + Release
      # ---------------------------------------------

      - name: Build and publish Origin
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: v__VERSION__

          releaseName: "Origin v__VERSION__"

          releaseBody: |
            ## Origin v__VERSION__

            Download the installer for your platform below.

            ### What's included

            - Folder browser improvements
            - Project detection improvements
            - macOS support
            - macOS builds are ad-hoc signed and are not notarized or Apple-verified
            - Performance improvements
            - Bug fixes

          releaseDraft: false

          prerelease: false

          generateReleaseNotes: true

          uploadUpdaterJson: true

          uploadUpdaterSignatures: true

          args: ${{ matrix.args }}

      - name: Verify macOS app bundle signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          app_path="$(find "src-tauri/target/${{ matrix.target }}/release/bundle" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"