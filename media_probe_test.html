<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GSMTC Probe Test</title>
  </head>
  <body>
    <h1>GSMTC Probe Test</h1>
    <p id="status">Preparing audio...</p>
    <audio id="player" controls autoplay loop></audio>
    <script>
      function createToneWavUrl() {
        const sampleRate = 44100;
        const durationSeconds = 2;
        const frameCount = sampleRate * durationSeconds;
        const bytesPerSample = 2;
        const blockAlign = bytesPerSample;
        const byteRate = sampleRate * blockAlign;
        const dataSize = frameCount * bytesPerSample;
        const buffer = new ArrayBuffer(44 + dataSize);
        const view = new DataView(buffer);

        function writeString(offset, text) {
          for (let i = 0; i < text.length; i += 1) {
            view.setUint8(offset + i, text.charCodeAt(i));
          }
        }

        writeString(0, "RIFF");
        view.setUint32(4, 36 + dataSize, true);
        writeString(8, "WAVE");
        writeString(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, 16, true);
        writeString(36, "data");
        view.setUint32(40, dataSize, true);

        const frequency = 440;
        const amplitude = 0.25;

        for (let i = 0; i < frameCount; i += 1) {
          const sample =
            Math.sin((2 * Math.PI * frequency * i) / sampleRate) * amplitude;
          view.setInt16(44 + i * 2, sample * 32767, true);
        }

        const blob = new Blob([buffer], { type: "audio/wav" });
        return URL.createObjectURL(blob);
      }

      const player = document.getElementById("player");
      const status = document.getElementById("status");
      player.src = createToneWavUrl();
      player.play()
        .then(() => {
          status.textContent = "Audio is playing in a loop.";
        })
        .catch((error) => {
          status.textContent = `Playback failed: ${error}`;
        });
    </script>
  </body>
</html>
